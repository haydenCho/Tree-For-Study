# 브라우저 E2E 전용 오버레이. 별도 프로젝트 이름(-p tfs-e2e)으로 띄워 개발 DB와 분리한다.
#   ./e2e/run.sh   (스택 기동 → 운영자/초대 생성 → Playwright 실행 → 정리)
# 호스트 포트를 열지 않고 compose 내부 네트워크에서만 접속한다.
services:
  db:
    ports: !reset []
  backend:
    ports: !reset []
    environment:
      WORKER_INTERVAL_SECONDS: "1"
  frontend:
    ports: !reset []
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /e2e
    env_file: .env
    environment:
      E2E_BASE_URL: http://frontend:5173
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      - frontend
    profiles: ["e2e"]

volumes:
  e2e_node_modules:
