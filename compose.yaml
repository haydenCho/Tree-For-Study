# 개발 스택. Vite 개발 서버가 /api를 backend로 프록시한다(vite.config.js 참고).
# 그래서 브라우저는 운영과 동일하게 같은 출처의 VITE_API_BASE_URL=/api를 쓴다.
# 여기서 호스트 포트를 여는 것은 로컬 디버깅 용도이며, 운영은 db/backend를 비공개로 둔다.
# 호스트 포트가 다른 프로젝트와 겹치면 .env의 *_HOST_PORT 값으로 바꾼다(기본 5432/8000/5173).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # 시작할 때 마이그레이션을 적용한 뒤 개발 서버를 띄운다.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers"
    env_file: .env
    environment:
      TZ: ${TZ}
      # 개발 전용: 브라우저 E2E(Playwright 컨테이너)가 http://frontend:5173 출처로 접속한다.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173},http://frontend:5173
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      # Vite 개발 프록시 대상(서버 측에서만 사용, 번들에 포함되지 않음):
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
